[project]
name = "tikdown-rs"
version = "0.1.0"
description = "CLI + Daemon + Telegram para archivar vídeos de TikTok de forma automatizada y resistente a bloqueos"
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    # yt-dlp nightly — pin exacto de fecha (canal nightly, nunca estable). T4: la versión
    # interna (yt_dlp.version.__version__) coincide con el tag de GitHub, no la del gestor.
    # El extra pin-curl-cffi fija la versión exacta de curl-cffi soportada por esta nightly (T6).
    "yt-dlp[default,curl-cffi,pin-curl-cffi]==2026.8.27.231323.dev0",
    # curl-cffi — pin exacto vía extra pin-curl-cffi (nunca rango; serie <0.16 soportada, T6)
    "aiosqlite>=0.22.1",  # excluye 0.22.0 (regresión de hang, §1)
    "SQLAlchemy>=2.0.51,<2.1",
    "APScheduler>=3.11,<4",
    "python-telegram-bot[rate-limiter]>=22",
    "typer>=0.27",
    "rich>=15",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "cryptography>=50",
    "httpx>=0.28",
    "alembic>=1.18",
]

[project.scripts]
tikdown-rs = "tikdown_rs.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tikdown_rs"]

[tool.uv]
# NUNCA prerelease global (T2): solo el paquete que lo necesita puede resolver a prerelease.
prerelease-package = { "yt-dlp" = "allow" }

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "pytest-cov>=7.0.0",  # habilita --cov (pytest-cov) en CI Woodpecker
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "pyyaml>=6.0",  # tests/ci/test_woodpecker_ci.py parsea .woodpecker.yml
]
