# Runtime composition for TikDown-rs (specs §14.1).
# Healthcheck is inherited from the image definition (Dockerfile HEALTHCHECK).
services:
  tikdown-rs:
    build:
      context: .
    restart: on-failure
    # T-DEPLOY-13: a clean `daemon stop` (exit 0) must stay stopped; only
    # crashes (non-zero exit) are restarted. Never use the always-restart policy.
    env_file:
      # Local secrets; .env must NOT be committed (.gitignore keeps it out).
      - path: .env
        required: false
    volumes:
      # <host-data> placeholder: point this at the real host data directory.
      - ./data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Static dashboard server (§10.3): serves the 4 files `system site render`
  # writes into <data_dir>/public. Read-only mount; regenerate the files with
  # `tikdown-rs system site render` (CLI or the scheduler job when
  # STATIC_SITE_ENABLED) and refresh the browser -- no server reload needed.
  site:
    image: nginx:alpine
    depends_on:
      - tikdown-rs
    restart: on-failure
    ports:
      - "${SITE_PORT:-8080}:80"
    volumes:
      - ./data/public:/usr/share/nginx/html:ro
