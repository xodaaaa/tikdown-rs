      (F-10); no producir 'paused' (valor reservado, §2).
    verify: "uv run pytest tests/backfill/test_backfill_queue.py -q"
    status: todo
  - id: e04s03-t02
    description: >-
      Cancelación real (T21): backfill cancel @user interrumpe la pasada en curso y marca
      'cancelled'; re-ejecución retoma desde el cursor. retry-failed con --all global: requiere
      resumen previo + confirmación (volumen = horas/días, §3).
    verify: "uv run pytest tests/backfill/test_backfill_cancel.py -q"
    status: todo
